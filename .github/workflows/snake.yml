# Draws the contribution-graph snake in the README's palette.
# Output lands on the `output` branch; the README reads it from there.
name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#E693AC&color_dots=#1F1228,#3A2346,#7C51B4,#B594E3,#DAB56B
            dist/github-snake.svg?color_snake=#C4638A&color_dots=#F3EAF5,#E2CDEF,#B594E3,#7C51B4,#4B2A6E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
