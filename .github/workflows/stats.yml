# Builds the GitHub stats, top-languages and activity cards inside this repo,
# so the README never depends on a public server that can go down.
name: Update stats cards

on:
  schedule:
    - cron: "30 0 * * *"   # once a day
  workflow_dispatch:        # run it manually from the Actions tab
  push:
    branches: [main]
    paths-ignore: ["profile/**"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&bg_color=130A18&title_color=E693AC&text_color=C4B2CC&icon_color=DAB56B&ring_color=B594E3&border_color=34213E&border_radius=16
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=130A18&title_color=E693AC&text_color=C4B2CC&border_color=34213E&border_radius=16
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Activity graph
        run: python .github/scripts/activity_graph.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
