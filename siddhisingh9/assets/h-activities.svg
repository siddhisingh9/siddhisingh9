<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="108" viewBox="0 0 1200 108" fill="none" role="img" aria-label="Activities — Leadership &amp; involvement"><title>Activities — Leadership &amp; involvement</title><defs><style>@font-face{font-family:'SM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ISI';src:url(data:font/woff2;base64,) format('woff2');}.mono{font-family:'SM','Courier New',monospace}.serif{font-family:'IS',Georgia,'Times New Roman',serif}.serifi{font-family:'ISI',Georgia,'Times New Roman',serif}
text{white-space:pre}
.fb{transform-box:fill-box;transform-origin:center}
.tw{animation:twinkle 4s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1s ease both}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
