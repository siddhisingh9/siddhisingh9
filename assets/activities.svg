DesignX · Design Club</tspan></text><text x="332.0" y="222.0" font-size="14.5" text-anchor="start" ><tspan class="sans" fill="#C4B2CC" >Designing user-friendly websites and leading sessions on UI/UX principles and best practices.</tspan></text></g><g class="up" style="animation-delay:0.56s"><circle cx="62" cy="266" r="5.5" fill="#130A18" stroke="#DAB56B" stroke-width="1.6"/><text x="96.0" y="271.0" font-size="11.5" text-anchor="start" letter-spacing="1" ><tspan class="mono" fill="#8B7692" >OCT 2025 – APR 2026</tspan></text><text x="330.0" y="274.0" font-size="28" text-anchor="start" ><tspan class="serif" fill="#F7EFF6" >Core Member</tspan></text><text x="332.0" y="299.0" font-size="12.5" text-anchor="start" ><tspan class="mono" fill="#DAB56B" >Google Developer Group</tspan></text><text x="332.0" y="326.0" font-size="14.5" text-anchor="start" ><tspan class="sans" fill="#C4B2CC" >Helped organize technical workshops built around hands-on learning and community.</tspan></text></g><g class="up" style="animation-delay:0.74s"><circle cx="62" cy="370" r="5.5" fill="#130A18" stroke="#B594E3" stroke-width="1.6"/><text x="96.0" y="375.0" font-size="11.5" text-anchor="start" letter-spacing="1" ><tspan class="mono" fill="#8B7692" >JUN – AUG 2025</tspan></text><text x="330.0" y="378.0" font-size="28" text-anchor="start" ><tspan class="serif" fill="#F7EFF6" >Mentor</tspan></text><text x="332.0" y="403.0" font-size="12.5" text-anchor="start" ><tspan class="mono" fill="#B594E3" >Student Mentorship Program</tspan></text><text x="332.0" y="430.0" font-size="14.5" text-anchor="start" ><tspan class="sans" fill="#C4B2CC" >Mentored junior students and developed the Polaris website.</tspan></text></g></svg>