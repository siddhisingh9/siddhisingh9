<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="466" viewBox="0 0 1200 466" fill="none" role="img" aria-label="Activities — OpenLake, DesignX, Google Developer Group, Student Mentorship Program"><title>Activities — OpenLake, DesignX, Google Developer Group, Student Mentorship Program</title><defs><style>@font-face{font-family:'SM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MR';src:url(data:font/woff2;base64,) format('woff2');}.mono{font-family:'SM','Courier New',monospace}.serif{font-family:'IS',Georgia,'Times New Roman',serif}.sans{font-family:'MR',system-ui,'Segoe UI',Arial,sans-serif}
text{white-space:pre}
.fb{transform-box:fill-box;transform-origin:center}
.tw{animation:twinkle 4s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
