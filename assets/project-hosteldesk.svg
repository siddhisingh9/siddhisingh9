<svg xmlns="http://www.w3.org/2000/svg" width="590" height="414" viewBox="0 0 590 414" fill="none" role="img" aria-label="Project — HostelDesk"><title>Project — HostelDesk</title><defs><style>@font-face{font-family:'SM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MR';src:url(data:font/woff2;base64,) format('woff2');}.mono{font-family:'SM','Courier New',monospace}.serif{font-family:'IS',Georgia,'Times New Roman',serif}.sans{font-family:'MR',system-ui,'Segoe UI',Arial,sans-serif}
text{white-space:pre}
.fb{transform-box:fill-box;transform-origin:center}
.tw{animation:twinkle 4s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.2s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.up{animation:up .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1s ease both}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.95}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tk{animation:tk 9s cubic-bezier(.22,1,.36,1) infinite both}
@keyframes tk{0%{opacity:0;transform:translateX(-18px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
.ch{animation:ch 9s cubic-bezier(.22,1,.36,1) infinite both}
@keyframes ch{0%,4%{opacity:0;transform:scale(.6)}9%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
